<!DOCTYPE html>
<!-- @author Yousuf Yesil <yousufyesil@icloud.com> -->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Golf-Klassifikations-Plattform{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="name">Golf-Plattform</span>
        <span class="tagline">SigLIP2 · kNN-Retrieval</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
          Übersicht
        </a>
        <a href="/infer" class="{{ 'active' if request.url.path == '/infer' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          Klassifizieren
        </a>
        <a href="/images" class="{{ 'active' if request.url.path == '/images' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="10" r="1.75"/><path d="m3 17 5.5-5.5a2 2 0 0 1 2.8 0L18 18"/></svg>
          Daten
        </a>
        <a href="/lots" class="{{ 'active' if request.url.path == '/lots' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4h12a1 1 0 0 1 1 1v15l-3-2-2 2-2-2-2 2-2-2-3 2V5a1 1 0 0 1 1-1Z"/><path d="M8.5 9h7M8.5 12.5h7"/></svg>
          Anzeigen
        </a>
        <a href="/models" class="{{ 'active' if request.url.path == '/models' else '' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
          Modell
        </a>
      </nav>
    </aside>
    <div class="shell-main">
      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="/static/app.js?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
